<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobSpy — Dashboard</title>
<style>
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --border:#232a36;
  --text:#e6edf3; --muted:#8b96a5; --muted2:#5b6472;
  --accent:#5eb0ff; --accent-2:#4a91d8; --pri:#ffcc45; --applied:#4ade80;
  --danger:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* Layout */
header{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px;letter-spacing:.3px}
header .brand small{color:var(--muted);font-weight:400;margin-left:6px}

.searchbox{flex:1 1 300px;min-width:200px;position:relative}
.searchbox input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 34px 8px 12px;outline:none}
.searchbox input:focus{border-color:var(--accent)}
.searchbox .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:12px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 6px}

.pill{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.pill.active{background:var(--accent);color:#0b1017;border-color:var(--accent)}
.pill:hover{border-color:var(--accent)}

.controls{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.controls select{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text)}

.stats{padding:8px 16px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats strong{color:var(--text)}
.stats .dot{width:8px;height:8px;background:var(--applied);border-radius:50%;box-shadow:0 0 6px var(--applied)}
.stats .dot.stale{background:#eab308}
.stats .dot.err{background:var(--danger)}

/* List */
#listContainer{position:relative;height:calc(100vh - 165px);overflow:auto;padding:0}
@media(max-width:640px){#listContainer{height:calc(100vh - 200px)}}
.sizer{position:relative;width:100%}
.row{position:absolute;left:0;right:0;padding:10px 16px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.row:hover{background:var(--panel)}
.row.applied{opacity:.55}
.row.applied .title{text-decoration:line-through}
.row.priority{background:linear-gradient(90deg,rgba(255,204,69,.05),transparent 40%);border-left:3px solid var(--pri)}
.row .col-check{padding-top:2px}
.row .col-check input{width:18px;height:18px;cursor:pointer;accent-color:var(--applied)}
.row .company{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.row.priority .company{color:var(--pri)}
.row .company .flag{margin-right:4px}
.row .title{font-weight:500;color:var(--text);display:block;margin:2px 0}
.row .title a{color:inherit}
.row .meta{color:var(--muted);font-size:12px}
.row .meta .sep{color:var(--muted2);margin:0 4px}
.row .col-actions{display:flex;gap:4px}
.row .col-actions button{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;color:var(--muted);cursor:pointer;font-size:14px}
.row .col-actions button:hover{border-color:var(--border);color:var(--text)}
.row .col-actions button.on{color:var(--pri)}
.row .col-actions button.hide.on{color:var(--danger)}

.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.loading{padding:20px 16px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand">JobSpy <small id="totalCount">—</small></div>
  <div class="searchbox">
    <input id="searchInput" type="search" placeholder="Search title, company, location…" autocomplete="off" />
    <span class="kbd">/</span>
  </div>
  <button id="regionAll" class="pill active" data-region="">All</button>
  <button class="pill" data-region="india">🇮🇳 India</button>
  <button class="pill" data-region="global">🌐 US / EU</button>
</header>

<div class="controls">
  <select id="profileSel"><option value="">Any country</option></select>
  <select id="companySel"><option value="">Any company</option></select>
  <select id="postedSel">
    <option value="">Any time</option>
    <option value="1">Last hour</option>
    <option value="6">Last 6 hours</option>
    <option value="24">Last 24 hours</option>
    <option value="168">Last week</option>
  </select>
  <select id="orderSel">
    <option value="first_seen_at|true">Newest first</option>
    <option value="first_seen_at|false">Oldest first</option>
    <option value="company|false">Company A→Z</option>
    <option value="is_priority|true">Priority first</option>
  </select>
  <button id="priBtn" class="pill" title="Priority only">⭐ Priority</button>
  <button id="appBtn" class="pill" title="Show applied only">✓ Applied</button>
  <button id="savedBtn" class="pill" title="Saved only">♥ Saved</button>
  <button id="hideBtn" class="pill" title="Show hidden">🕇 Hidden</button>
  <button id="clearBtn" class="pill">Clear</button>
</div>

<div class="stats">
  <span class="dot" id="statusDot"></span>
  <span id="statsText">—</span>
</div>

<div id="listContainer">
  <div class="sizer" id="sizer"></div>
  <div id="rowsHost"></div>
</div>

<script>
(() => {
const API = "/api";
const ROW_H = 84;      // px per row (grid single-line collapse in mobile still ~84)
const PAGE_SIZE = 100;
const BUFFER = 5;      // rows above/below viewport to keep mounted
const state = {
  q: "", region: "", profile: "", company: "", posted: "",
  order: "first_seen_at", desc: true,
  priority: null, applied: null, saved: null, hidden: false,
  total: 0, pages: new Map(),  // page# -> rows[]
  inflight: new Set(),
};

const $ = id => document.getElementById(id);
const listEl = $("listContainer");
const sizer = $("sizer");
const rowsHost = $("rowsHost");

function debounce(fn, ms){let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a), ms);};}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtRel(iso){
  if(!iso) return "";
  const d = new Date(iso); const s = (Date.now() - d.getTime())/1000;
  if(s<60) return Math.round(s)+"s ago";
  if(s<3600) return Math.round(s/60)+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function shortLoc(l){return (l||"").split(",")[0].trim();}

function params(){
  const p = new URLSearchParams();
  if(state.q) p.set("q", state.q);
  if(state.region) p.set("region", state.region);
  if(state.profile) p.set("profile", state.profile);
  if(state.company) p.set("company", state.company);
  if(state.posted) p.set("posted", state.posted);
  if(state.priority) p.set("priority", "1");
  if(state.applied!=null) p.set("applied", state.applied?"1":"0");
  if(state.saved) p.set("saved", "1");
  if(state.hidden===false) p.set("hidden", "0"); // hide hidden by default
  else if(state.hidden===true) p.set("hidden", "1"); // show hidden only
  p.set("order", state.order);
  p.set("desc", state.desc?"true":"false");
  return p;
}

async function fetchPage(page){
  const key = page;
  if(state.pages.has(key) || state.inflight.has(key)) return;
  state.inflight.add(key);
  const p = params();
  p.set("limit", String(PAGE_SIZE));
  p.set("offset", String(page * PAGE_SIZE));
  try{
    const r = await fetch(`${API}/jobs?${p}`, {cache:"no-store"});
    const j = await r.json();
    state.total = j.total;
    state.pages.set(key, j.jobs);
    sizer.style.height = (state.total * ROW_H) + "px";
    setStats(`${j.total.toLocaleString()} jobs`);
    renderVisible();
  }catch(e){ setStats("error: "+e.message, "err"); }
  finally{ state.inflight.delete(key); }
}

async function reset(){
  state.pages.clear();
  state.total = 0;
  sizer.style.height = "0px";
  rowsHost.innerHTML = `<div class="loading">Loading…</div>`;
  await fetchPage(0);
}

let lastRenderedRange = [null,null];
function renderVisible(){
  const top = listEl.scrollTop;
  const height = listEl.clientHeight;
  let startIdx = Math.max(0, Math.floor(top / ROW_H) - BUFFER);
  let endIdx = Math.min(state.total, Math.ceil((top + height) / ROW_H) + BUFFER);

  // Ensure needed pages are fetched.
  const pStart = Math.floor(startIdx / PAGE_SIZE);
  const pEnd = Math.floor(Math.max(0, endIdx - 1) / PAGE_SIZE);
  for(let p = pStart; p <= pEnd; p++){
    if(!state.pages.has(p)) fetchPage(p);
  }

  if(state.total === 0){
    rowsHost.innerHTML = `<div class="empty">No jobs match.</div>`;
    return;
  }

  // Build DOM
  const buf = [];
  for(let i = startIdx; i < endIdx; i++){
    const p = Math.floor(i / PAGE_SIZE);
    const off = i % PAGE_SIZE;
    const page = state.pages.get(p);
    if(!page || !page[off]){
      buf.push(`<div class="row" style="top:${i*ROW_H}px;height:${ROW_H}px"><div></div><div style="color:var(--muted2)">…</div><div></div></div>`);
      continue;
    }
    const j = page[off];
    const cls = ["row"];
    if(j.is_priority) cls.push("priority");
    if(j.applied) cls.push("applied");
    buf.push(`<div class="${cls.join(' ')}" data-url="${escapeHtml(j.url)}" style="top:${i*ROW_H}px;height:${ROW_H}px">
      <div class="col-check"><input type="checkbox" class="chk-applied" ${j.applied?'checked':''} title="Mark applied" /></div>
      <div class="col-main">
        <div class="company"><span class="flag">${j.flag||''}</span>${escapeHtml(j.company||'?')}</div>
        <span class="title"><a href="${escapeHtml(j.url)}" target="_blank" rel="noopener">${escapeHtml((j.title||'').slice(0,120))}</a></span>
        <div class="meta">${escapeHtml(shortLoc(j.location))}${shortLoc(j.location)?'<span class="sep">·</span>':''}${escapeHtml(fmtRel(j.first_seen_at))}${j.is_priority?'<span class="sep">·</span>⭐':''}</div>
      </div>
      <div class="col-actions">
        <button class="btn-save ${j.saved?'on':''}" title="Save">♥</button>
        <button class="btn-hide hide ${j.hidden?'on':''}" title="Hide">🕇</button>
      </div>
    </div>`);
  }
  rowsHost.innerHTML = buf.join("");
}

listEl.addEventListener("scroll", () => requestAnimationFrame(renderVisible), {passive:true});
window.addEventListener("resize", () => requestAnimationFrame(renderVisible));

// Row action delegation
rowsHost.addEventListener("click", async e => {
  const row = e.target.closest(".row"); if(!row) return;
  const url = row.dataset.url;
  let kind=null, value=null;
  if(e.target.classList.contains("chk-applied")){
    kind = "applied"; value = e.target.checked;
  } else if(e.target.classList.contains("btn-save")){
    kind = "saved"; value = !e.target.classList.contains("on");
  } else if(e.target.classList.contains("btn-hide")){
    kind = "hidden"; value = !e.target.classList.contains("on");
  } else return;
  try{
    await fetch(`${API}/jobs/flag`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url, kind, value})});
    // Update cached row in-place
    for(const jobs of state.pages.values()){
      const j = jobs.find(x=>x.url===url); if(j){ j[kind]=value; }
    }
    // Rerender the current row
    renderVisible();
  }catch(err){}
});

// Filters
function setStats(text, kind){
  $("statsText").textContent = text;
  $("statusDot").className = "dot" + (kind ? " "+kind : "");
}
$("totalCount").textContent = "";

$("searchInput").addEventListener("input", debounce(e => { state.q = e.target.value.trim(); reset(); }, 200));
$("searchInput").addEventListener("keydown", e => { if(e.key==="Escape"){ e.target.value=""; state.q=""; reset(); }});

document.querySelectorAll("[data-region]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-region]").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  state.region = b.dataset.region;
  reset();
}));

$("profileSel").addEventListener("change", e => { state.profile = e.target.value; reset(); });
$("companySel").addEventListener("change", e => { state.company = e.target.value; reset(); });
$("postedSel").addEventListener("change",  e => { state.posted  = e.target.value; reset(); });
$("orderSel").addEventListener("change",   e => { const [o,d] = e.target.value.split("|"); state.order = o; state.desc = (d==="true"); reset(); });

$("priBtn").addEventListener("click", () => { state.priority = state.priority ? null : true; $("priBtn").classList.toggle("active", !!state.priority); reset(); });
$("appBtn").addEventListener("click", () => {
  state.applied = state.applied === null ? true : (state.applied ? false : null);
  $("appBtn").classList.toggle("active", state.applied !== null);
  $("appBtn").textContent = state.applied === true ? "✓ Applied only" : state.applied === false ? "✗ Not applied" : "✓ Applied";
  reset();
});
$("savedBtn").addEventListener("click", () => { state.saved = state.saved ? null : true; $("savedBtn").classList.toggle("active", !!state.saved); reset(); });
$("hideBtn").addEventListener("click", () => {
  state.hidden = state.hidden === false ? true : false;
  $("hideBtn").classList.toggle("active", state.hidden === true);
  $("hideBtn").textContent = state.hidden === true ? "🕇 Hidden only" : "🕇 Hidden";
  reset();
});
$("clearBtn").addEventListener("click", () => location.reload());

document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); $("searchInput").focus(); }
});

// Load meta once
async function loadMeta(){
  const [prof, cmp, st] = await Promise.all([
    fetch(`${API}/profiles`).then(r=>r.json()),
    fetch(`${API}/companies`).then(r=>r.json()),
    fetch(`${API}/stats`).then(r=>r.json()),
  ]);
  const ps = $("profileSel");
  prof.profiles.forEach(p => { const o = document.createElement("option"); o.value = p.profile; o.textContent = `${p.flag} ${p.display_name}`; ps.appendChild(o);});
  const cs = $("companySel");
  cmp.companies.slice(0,300).forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; cs.appendChild(o);});
  $("totalCount").textContent = st.totals ? `· ${st.totals.total.toLocaleString()} tracked` : "";
}

loadMeta();
reset();
setInterval(() => { if(state.pages.size && !state.inflight.size) reset(); }, 60000);

})();
</script>
</body>
</html>
